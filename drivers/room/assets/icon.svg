<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- House shape: roof + walls -->
  <path fill="#1E88E5" d="M 50,8 L 94,44 H 80 V 90 H 20 V 44 H 6 Z"/>

  <!-- Door -->
  <rect x="40" y="63" width="20" height="27" rx="3" fill="white"/>
  <!-- Door knob -->
  <circle cx="57" cy="77" r="1.8" fill="#1E88E5"/>

  <!-- Ceiling light (circle) -->
  <circle cx="50" cy="53" r="8" fill="white"/>
  <!-- Light rays -->
  <line x1="50" y1="41" x2="50" y2="38" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="59" y1="44" x2="61" y2="41" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="41" y1="44" x2="39" y2="41" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="62" y1="53" x2="65" y2="53" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="53" x2="35" y2="53" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>

  <!-- Motion sensor waves (right wall area) -->
  <path d="M 74 42 Q 81 52 74 62" fill="none" stroke="#4A90E2" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 79 37 Q 89 52 79 67" fill="none" stroke="#4A90E2" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
</svg>
