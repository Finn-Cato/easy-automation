<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="#EEF4FF"/>

  <!-- Room outline (floor-plan style) -->
  <rect x="12" y="20" width="76" height="68" rx="4" fill="none" stroke="#4A90E2" stroke-width="5"/>

  <!-- Door gap on left wall -->
  <rect x="8" y="36" width="8" height="22" fill="#EEF4FF"/>
  <!-- Door arc -->
  <path d="M 12 36 Q 30 36 30 58" fill="none" stroke="#4A90E2" stroke-width="2.5" stroke-dasharray="3,2"/>

  <!-- Light bulb in room centre -->
  <circle cx="56" cy="52" r="13" fill="#FFD700"/>
  <!-- Filament hint -->
  <path d="M51 54 Q56 48 61 54" fill="none" stroke="#E5B400" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bulb neck -->
  <rect x="51" y="65" width="10" height="4" rx="2" fill="#E5B400"/>
  <rect x="52" y="69" width="8" height="3" rx="1.5" fill="#E5B400"/>

  <!-- Motion sensor waves (right wall area) -->
  <path d="M 74 42 Q 81 52 74 62" fill="none" stroke="#4A90E2" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 79 37 Q 89 52 79 67" fill="none" stroke="#4A90E2" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
</svg>
