<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Room</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      padding: 16px;
      color: #111;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      color: #111;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #007aff;
    }

    .timeout-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timeout-row input[type="number"] {
      flex: 1;
    }

    .unit {
      font-size: 14px;
      color: #555;
      white-space: nowrap;
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .chip {
      background: #f0f4ff;
      color: #3366cc;
      border: 1px solid #c0cff8;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .chip:hover {
      background: #dce8ff;
    }

    .error-msg {
      color: #cc0000;
      font-size: 13px;
      margin-top: 4px;
      display: none;
    }

    .btn-add {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, opacity 0.18s;
    }

    .btn-add:hover { background: #0062cc; }
    .btn-add:disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>
    <!-- Room name -->
    <div class="field">
      <label for="room-name" data-i18n="pair.room_name_label">Room Name</label>
      <input type="text" id="room-name" maxlength="48"
             placeholder="e.g. Living Room, Bedroom, Garage" autocomplete="off" />
      <div class="error-msg" id="name-error" data-i18n="pair.error_name">
        Please enter a room name.
      </div>
      <!-- Quick-pick chips -->
      <div class="examples">
        <span class="chip" onclick="setName('Living Room')">Living Room</span>
        <span class="chip" onclick="setName('Bedroom')">Bedroom</span>
        <span class="chip" onclick="setName('Kitchen')">Kitchen</span>
        <span class="chip" onclick="setName('Garage')">Garage</span>
        <span class="chip" onclick="setName('Hallway')">Hallway</span>
        <span class="chip" onclick="setName('Office')">Office</span>
      </div>
    </div>

    <!-- Motion timeout -->
    <div class="field">
      <label for="motion-timeout" data-i18n="pair.timeout_label">
        Turn off after no motion for
      </label>
      <div class="timeout-row">
        <input type="number" id="motion-timeout" value="5" min="1" max="120" />
        <span class="unit" data-i18n="pair.timeout_unit">minutes</span>
      </div>
      <p class="hint" data-i18n="pair.timeout_hint">
        The "No motion" flow trigger fires after this many minutes without motion.
      </p>
    </div>

    <button class="btn-add" id="add-btn" data-i18n="pair.add_button" onclick="addRoom()">
      Add Room
    </button>

  <script>
    function setName(name) {
      document.getElementById('room-name').value = name;
      document.getElementById('room-name').focus();
    }

    function addRoom() {
      const nameInput    = document.getElementById('room-name');
      const timeoutInput = document.getElementById('motion-timeout');
      const nameError    = document.getElementById('name-error');
      const btn          = document.getElementById('add-btn');

      const name    = nameInput.value.trim();
      const timeout = parseInt(timeoutInput.value, 10);

      // Validate name
      if (!name) {
        nameError.style.display = 'block';
        nameInput.focus();
        return;
      }
      nameError.style.display = 'none';

      // Validate timeout
      if (isNaN(timeout) || timeout < 1 || timeout > 120) {
        Homey.alert('Timeout must be between 1 and 120 minutes.');
        timeoutInput.focus();
        return;
      }

      btn.disabled = true;

      Homey.emit('set_data', { name: name, timeout: timeout }, function(err) {
        if (err) {
          Homey.alert(err.message || err);
          btn.disabled = false;
          return;
        }
        Homey.nextView();
      });
    }

    // Submit on Enter key in the name field
    document.getElementById('room-name').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addRoom();
    });
  </script>
</body>
</html>
